services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syncbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syncbook}
      POSTGRES_DB: ${POSTGRES_DB:-syncbook}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U syncbook"], interval: 3s, timeout: 3s, retries: 20 }
    volumes: [syncbook-data:/var/lib/postgresql/data]
  server:
    build: ./server
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-syncbook}:${POSTGRES_PASSWORD:-syncbook}@postgres:5432/${POSTGRES_DB:-syncbook}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SERVER_PORT: 3000
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["${SERVER_PORT:-3000}:3000"]
  web:
    build: ./web
    depends_on: [server]
    ports: ["${WEB_PORT:-8080}:80"]
volumes:
  syncbook-data:
