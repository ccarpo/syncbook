name: CI
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://syncbook:syncbook@localhost:5432/syncbook
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: syncbook
          POSTGRES_PASSWORD: syncbook
          POSTGRES_DB: syncbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syncbook -d syncbook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
